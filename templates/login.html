<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Login - USAT{% endblock %}</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            background-color: #dde1eb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        .login-container {
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 400px;
            text-align: center;
        }

        .login-container img {
            max-width: 150px;
            margin-bottom: 20px;
        }

        .login-container h1 {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 20px;
        }

        .login-container .form-control {
            padding-right: 2.5rem;
        }

        .login-container .input-group-text {
            background-color: transparent;
            border: none;
        }

        .login-container .btn-login {
            background-color: #c20808;
            border-color: #c20808;
            color: white;
            width: 100%;
            font-size: 1rem;
        }

        .login-container .btn-login:hover {
            background-color: #a50707;
            border-color: #a50707;
        }

        .login-container p {
            font-size: 0.9rem;
            color: #666;
            margin-top: 15px;
        }

        footer {
            text-align: center;
            padding: 10px;
            background-color: #d32f2f;
            color: white;
            position: fixed;
            bottom: 0;
            width: 100%;
        }

        footer p {
            margin: 0;
        }
    </style>
    {% block extra_head %}
    {% endblock %}
</head>
<body>
    <div class="login-container mx-2 py-2 pt-5">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/0a/Logo_USAT.png/1200px-Logo_USAT.png" class="img-fluid mb-3" alt="USAT Logo"> <!-- Imagen del logo -->

        <h1 class="mt-3">Iniciar sesión</h1>

        <div class="card-body">
            <form action="{{url_for('proceso_login')}}" method="post">
                <div class="mb-3 input-group">
                    <input type="text" name="usuario" class="form-control " id="username" placeholder="Usuario" required>
                    <span class="input-group-text">
                        <i class="fas fa-id-card"></i> <!-- Ícono de usuario -->
                    </span>
                </div>

                <div class="mb-3 input-group"  style="width: 296px;">
                    <input type="password" name="contraseña" class="form-control" id="password" placeholder="Contraseña" required>
                    <span class="input-group-text">
                        <i class="fas fa-lock"></i> <!-- Ícono de contraseña -->
                    </span>
                </div>

                {% if mensaje %}
                    <p style="color:red;">{{ mensaje }}</p>
                {% endif %}

                <div class="d-flex justify-content-center">
                    <button type="submit" class="btn btn-login">Ingresar</button>
                </div>
            </form>

            <div class="mt-4">
                <p>Av. San Josémaría Escrivá de Balaguer N° 855 Chiclayo - Perú</p>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2024 | Los Chamos de Marlon</p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
</body>
</html>
